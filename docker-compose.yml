services:
  db:
    image: timescale/timescaledb:2.14.2-pg16
    environment:
      POSTGRES_USER: valuebet
      POSTGRES_PASSWORD: valuebet
      POSTGRES_DB: valuebet
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuebet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_BROWSERS: "true"
    command: uvicorn valuebet.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://valuebet:valuebet@db:5432/valuebet
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    build:
      context: .
      args:
        INSTALL_BROWSERS: "true"
    command: python -m valuebet.scheduler.run
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://valuebet:valuebet@db:5432/valuebet
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  dbdata:
